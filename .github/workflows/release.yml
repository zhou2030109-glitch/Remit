name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image to GitHub Container Registry
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7
        with:
          node-version-file: frontend/.node-version
      - name: Validate package versions
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          root = pathlib.Path(".")
          frontend = json.loads((root / "frontend/package.json").read_text(encoding="utf-8"))["version"]
          backend = tomllib.loads((root / "backend/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if frontend != backend:
              raise SystemExit(f"frontend version {frontend} != backend version {backend}")

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              if tag != frontend:
                  raise SystemExit(f"tag {tag} != package version {frontend}")
          print(f"release metadata ok: {frontend}")
          PY
      - name: Validate release Compose file
        run: docker compose -f docker-compose.release.yml config --quiet

  image:
    name: Build production image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compute lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}

  github-release:
    name: Publish GitHub Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Remit ${{ github.ref_name }}
          body_path: docs/releases/2.0.1.md
          files: |
            docker-compose.release.yml
            docs/distribution.md
