name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            name: Windows-x64
          - runner: macos-15
            name: macOS-arm64
          - runner: macos-15-intel
            name: macOS-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.10'
          python-version: '3.12.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install -g pnpm@10.6.3
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: python tools/check_public_tree.py
      - name: Build and verify bundled runtime
        run: python tools/build_desktop.py --build-root "${{ runner.temp }}/Remit build"
      - name: Install, relocate and verify the finished package
        run: python tools/test_desktop_installer.py --build-root "${{ runner.temp }}/Remit build"
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: checks-${{ matrix.name }}
          path: ${{ runner.temp }}/Remit build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.name }}
          path: ${{ runner.temp }}/Remit build/output/*
          compression-level: 0
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - uses: actions/download-artifact@v7
        with:
          pattern: checks-*
          path: reports
      - name: Bundle verification reports
        run: tar czf installers/Remit-verification-reports.tar.gz -C reports .
      - name: Attach tested unsigned installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Remit $RELEASE_TAG" --notes-file docs/releases/2.0.1.md
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber
