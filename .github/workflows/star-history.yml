name: Star History

on:
  # Generate the chart as soon as this workflow is first added.
  push:
    branches: [main]
    paths:
      - .github/workflows/star-history.yml
  # Refresh quickly after a new star and reconcile unstars once a week.
  watch:
    types: [started]
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: narayann7/star-history-action@12543ab7352b91fb7c5eb0c4fbb39772baa0c168 # v1.0.6
        with:
          update-readme: "false"
          commit: "false"
      - name: Publish charts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan __star_history_publish
          git reset -q
          git add -f assets/star-history
          git commit -q -m "chore: update star history chart"
          git push -f origin HEAD:refs/heads/star-history
