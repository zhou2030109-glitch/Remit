name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-launchers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            venv-python: "backend\\.venv\\Scripts\\python.exe"
          - os: macos-latest
            venv-python: "backend/.venv/bin/python"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.3
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install uv
        run: python -m pip install uv
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Lint backend
        working-directory: backend
        run: uv run ruff check app tests
      - name: Install Redis for POSIX launcher check
        if: runner.os == 'macOS'
        run: brew install redis
      - name: Test backend
        working-directory: backend
        run: uv run pytest tests -q
      - name: Prepare frontend dependencies for launcher check
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test launchers and repository contracts
        run: ${{ matrix.venv-python }} -m pytest tests -q

  # Keep the required check name stable when the platform matrix changes.
  backend-and-launchers-status:
    name: backend-and-launchers
    needs: backend-and-launchers
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all backend and launcher checks to pass
        env:
          BACKEND_RESULT: ${{ needs.backend-and-launchers.result }}
        run: test "$BACKEND_RESULT" = success

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.3
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        working-directory: frontend
        run: pnpm run lint
      - name: Test frontend behavior
        working-directory: frontend
        run: pnpm run test
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build
