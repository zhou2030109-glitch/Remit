name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install -g pnpm@10.6.3
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test && pnpm build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.10'
          python-version: '3.12'
      - name: Install runtime dependencies for integration tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk redis-server xvfb
      - run: uv sync --locked
        working-directory: backend
      - run: python tools/check_public_tree.py
      - run: uv run pytest tests -q
        working-directory: backend
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install -g pnpm@10.6.3
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: xvfb-run -a uv run --project backend pytest tests -q
  backend-and-launchers-status:
    name: backend-and-launchers
    needs: backend
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the original required check
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: test "$BACKEND_RESULT" = success
