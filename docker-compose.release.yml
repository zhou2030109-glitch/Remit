# 发布环境：前后端合一，直接使用已构建镜像；不挂载源码或本机密钥。
name: remit-release

services:
  remit:
    image: ${REMIT_IMAGE:-remit:2.0.1}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    init: true
    ports:
      - "127.0.0.1:${REMIT_PORT:-18000}:8000"
    environment:
      SERVER_HOST: http://localhost:${REMIT_PORT:-18000}
      REMIT_USER_CONFIG_PATH: /app/config/.env.user
      CODE_EXECUTION_BACKEND: python
      LOG_LEVEL: INFO
      DEBUG: "false"
    volumes:
      - remit_config:/app/config
      - remit_project:/app/backend/project
      - remit_logs:/app/backend/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; s=json.load(urllib.request.urlopen('http://127.0.0.1:8000/status',timeout=3)); raise SystemExit(0 if s['task_bus']['status']=='running' else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 4
    restart: unless-stopped

volumes:
  remit_config:
  remit_project:
  remit_logs:
